name: Static Code Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sca:
    name: SCA (PHP ${{ matrix.php-version }}, TYPO3 ${{ matrix.typo3-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4"]
        typo3-version: ["13.4", "14.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer update --with=typo3/cms-core:"^${{ matrix.typo3-version }}" --no-progress --prefer-dist

      - name: Validate composer.json
        run: composer validate --strict

      - name: Run static code analysis
        run: composer ci:sca
