services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    MaikSchneider\SolrShield\:
        resource: '../Classes/*'

    MaikSchneider\SolrShield\EventListener\AfterUriIsProcessedEventListener:
        tags:
            - name: 'event.listener'
              identifier: 'solrShield/afterUriIsProcessed'

    MaikSchneider\SolrShield\EventListener\AfterLinkIsGeneratedEventListener:
        tags:
            - name: 'event.listener'
              identifier: 'solrShield/afterLinkIsGenerated'
